<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#255d4a"><meta name="description" content="A simple task list with tags.">
<title>Tasks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23255d4a'/%3E%3Cpath d='m18 33 9 9 19-22' stroke='white' stroke-width='6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css"><script src="published-tasks.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<main class="app">
<header class="list-heading"><h1>Tasks</h1><button class="primary" id="new-task">＋ New task</button></header>
<nav aria-label="Task views" id="views">
<button class="nav-item selected" data-view="todo" aria-current="page">To Do <span id="count-todo" class="count">0</span></button>
<button class="nav-item" data-view="completed">Completed <span id="count-completed" class="count">0</span></button>
</nav>
<section class="workspace" aria-label="Tasks">
<div class="toolbar"><label class="search"><span class="sr-only">Search tasks</span><input id="search" type="search" placeholder="Search tasks or tags" aria-label="Search tasks"></label><label class="sr-only" for="priority-filter">Filter priority</label><select id="priority-filter"><option value="all">All priorities</option><option value="high">High priority</option><option value="medium">Medium priority</option><option value="low">Low priority</option></select><label class="sr-only" for="sort">Sort tasks</label><select id="sort"><option value="newest">Newest first</option><option value="due">Due date</option><option value="priority">Priority</option></select></div>
<h2 id="list-title" class="sr-only">To Do <span id="list-count">0</span></h2>
<div id="task-list"></div><div class="empty" id="empty"><h3>No tasks.</h3><button id="empty-add" class="text-button">＋ Add a task</button></div>
<div class="list-footer"><button id="clear-completed" hidden>Clear completed</button></div>
</section>
<footer><p class="storage-note">Edits save in this browser; not synced. Export a backup to move tasks.</p><div class="data-actions"><button id="export">Export</button><button id="import">Import</button><input type="file" id="import-file" accept="application/json,.json" hidden><button id="theme">Dark mode</button></div></footer>
</main>
<dialog id="task-dialog"><form id="task-form"><div class="modal-header"><h2 id="dialog-title">New task</h2><button type="button" class="icon-button" id="close-dialog" aria-label="Close dialog">×</button></div><label for="task-title">Task</label><input id="task-title" maxlength="200" required placeholder="Give your task a name" autocomplete="off"><label for="task-notes">Notes <span class="muted">(optional)</span></label><textarea id="task-notes" maxlength="2000" rows="3" placeholder="Optional details"></textarea><label for="task-tags">Tags <span class="muted">(comma-separated)</span></label><input id="task-tags" placeholder="lab, follow-up" autocomplete="off" aria-describedby="tags-help"><small id="tags-help">Use commas to separate tags.</small><div class="form-row"><div><label for="task-priority">Priority</label><select id="task-priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div><div><label for="task-due">Due date <span class="muted">(optional)</span></label><input id="task-due" type="date" max="9999-12-31"></div></div><div class="modal-actions"><button type="button" id="cancel-dialog">Cancel</button><button class="primary" type="submit">Save task</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden><span></span><button id="undo" hidden>Undo</button></div>
<noscript>This task list needs JavaScript enabled to save and manage your tasks.</noscript>
</body></html>
